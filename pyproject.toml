[tool.poetry]
name = "dotsoundbot"
version = "0.1.0"
description = "Telegram bot for DotSound"
authors = []
packages = [{ include = "bot" }]

[tool.poetry.dependencies]
python = "^3.12"
aiogram = {version = "^3.27", python = ">=3.12,<3.15"}
pydantic-settings = "^2.3"
httpx = "^0.27"
structlog = "^24.1"
aiohttp = "^3.9"
aiohttp-socks = "^0.10"
dotsound-private-core = { path = "../DotSoundPrivateCore", develop = true }
redis = "^7.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
anyio = { extras = ["trio"], version = "^4.4" }
pytest-anyio = "*"
mypy = "^1.10"
ruff = "^0.5"
black = "^24.4"
pytest-cov = "^5.0"
dirty-equals = "^0.8"

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "s3: tests requiring S3/MinIO",
    "redis: tests requiring Redis",
    "slow: slow integration tests",
]

[tool.coverage.run]
branch = true
source = ["bot"]
omit = [
    "*/main.py",
    "*/services/file_id_cache.py",
    "*/handlers/likes.py",
    "*/handlers/stats.py",
    "*/core/logging.py",
    "*/api/internal.py",
    "*/handlers/player.py",
    "*/middlewares/logging.py",
    "*/middlewares/throttling.py",
    "*/handlers/base.py",
    "*/handlers/playlists.py",
    "*/api/client.py",
    "*/utils/formatting.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
