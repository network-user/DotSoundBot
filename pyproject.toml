[tool.poetry]
name = "dotsoundbot"
version = "0.1.0"
description = "Telegram bot for DotSound"
authors = []
packages = [{ include = "bot" }]

[tool.poetry.dependencies]
python = "^3.12"
aiogram = "^3.7"
pydantic-settings = "^2.3"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
anyio = { extras = ["trio"], version = "^4.4" }
pytest-anyio = "*"
mypy = "^1.10"
ruff = "^0.5"
black = "^24.4"

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
